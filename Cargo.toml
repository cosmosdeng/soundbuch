[workspace]
resolver = "2"
members = [
    "crates/soundhub-core",
    "crates/soundhub-cli",
    "src-tauri",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
authors = ["soundbuch"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
walkdir = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
